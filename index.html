        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+KR:wght@500;700;800&display=swap');
        *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
        :root{
         --bg:#f6f7f9;
         --card:#ffffff;
         --line:#e4e6eb;
         --text:#050505;
         --sub:#65676b;
         --blue:#0866ff;
         --blue-soft:#f0f6ff;
         --green:#059669;
         --purple:#7c3aed;
         --red:#e11d48;
         --orange:#ea580c;
         --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
         --shadow-hover:0 4px 12px rgba(0,0,0,.08),0 16px 40px rgba(0,0,0,.08);
        }
        body{ margin:0; background:var(--bg); color:var(--text); font-family:Inter,"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased; user-select:none }
        button,input,textarea,select{ font:inherit }
        button{ border:0; cursor:pointer }

        .logo{ font-size:24px; font-weight:900; letter-spacing:-.8px }
        .logo span{ color:var(--blue) }
        .subtitle{ color:var(--sub); font-size:13px; margin-top:4px; font-weight:500 }
        .date-pill{ background:var(--card); border:1px solid var(--line); padding:7px 12px; border-radius:100px; font-size:12px; font-weight:700; color:var(--sub); box-shadow:0 1px 2px rgba(0,0,0,.04) }
        .section-title{ padding:0 20px; margin:22px 0 12px; font-size:14px; font-weight:800; letter-spacing:-.2px; display:flex; justify-content:space-between; align-items:center }
        .section-title small{ font-weight:600; color:var(--sub); font-size:11px }
        .dash-board{ margin:0 16px 18px; padding:14px; border:1.5px dashed #d0d7de; border-radius:24px; background:rgba(255,255,255,.7); backdrop-filter:blur(20px); min-height:112px; display:flex; flex-direction:column; gap:12px; transition:.2s }
        .dash-board.drag-over{ background:var(--blue-soft); border-color:var(--blue); border-style:solid }
        .dash-board-empty{ text-align:center; color:#8a8d91; font-size:13px; padding:26px 10px; line-height:1.6; font-weight:500 }
        .dash-board-empty b{ color:var(--text) }
        .drag-card{ position:relative; border-radius:22px; cursor:grab; transition:transform .18s,box-shadow .18s }
        .drag-card:active{ cursor:grabbing; transform:scale(.98) }
        .drag-card.dragging{ opacity:.4 }
        .card-remove-btn{ position:absolute; top:10px; right:10px; background:rgba(240,242,245,.85); color:#65676b; border-radius:100px; padding:5px 10px; font-size:11px; font-weight:700; z-index:5; backdrop-filter:blur(4px) }
        .card-remove-btn:hover{ background:#fee2e2; color:#dc2626 }
        .card-ai{ padding:20px; background:radial-gradient(120% 120% at 10% 0%,#3b82f6 0%,#0866ff 55%,#0047d1 100%); color:#fff; box-shadow:0 8px 28px rgba(8,102,255,.28) }
        .card-expense-dash{ padding:18px; background:radial-gradient(120% 120% at 0% 0%,#10b981 0%,#059669 100%); color:#fff; box-shadow:0 8px 28px rgba(5,150,105,.24) }
        .card-todo-dash,.card-generic-dash,.card-schedule-dash{ padding:18px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow) }
        .card-schedule-dash{ border-left:5px solid var(--purple) }
        .greeting{ color:#dbeafe; font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase }
        .today{ font-size:19px; font-weight:800; margin-top:4px; letter-spacing:-.4px }
        .ai-mini{ margin-top:14px; padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.16); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.18) }
        .ai-title{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13px }
        .ai-score{ font-size:22px; font-weight:900 }
        .ai-summary{ margin-top:6px; color:#eff6ff; font-size:12px; line-height:1.5; opacity:.95 }
        .menu{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px }
        .menu-item-btn{ position:relative; min-height:108px; border-radius:20px; background:var(--card); border:1px solid var(--line); color:var(--text); display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px; transition:.18s; box-shadow:0 1px 2px rgba(0,0,0,.04); cursor:pointer }
        .menu-item-btn:hover{ transform:translateY(-2px); box-shadow:var(--shadow-hover) }
        .menu-item-btn:active{ transform:scale(.97) }
        .menu-item-btn.is-placed{ border:2px solid var(--blue); background:var(--blue-soft) }
        .icon-wrap{ width:48px; height:48px; border-radius:14px; display:grid; place-items:center }
        .icon-wrap svg{ width:24px; height:24px }
        .label{ font-size:12.5px; font-weight:700; letter-spacing:-.2px }
        .menu-pin-badge{ position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:100px; background:var(--blue); color:#fff; display:grid; place-items:center }
        .menu-add-btn{ position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:100px; background:#f0f2f5; color:#65676b; display:grid; place-items:center }
        .card{ margin:0 16px 14px; padding:18px; border-radius:22px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow) }
        .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px }
        .stat{ background:#f6f7f9; border:1px solid #eef0f3; padding:14px 15px; border-radius:16px }
        .stat .name{ color:var(--sub); font-size:11px; font-weight:700; letter-spacing:.3px; text-transform:uppercase }
        .stat .value{ font-size:21px; font-weight:900; margin-top:6px; letter-spacing:-.5px }
        .row{ display:flex; justify-content:space-between; align-items:center }
        .progress{ height:8px; background:#e4e6eb; border-radius:100px; overflow:hidden; margin-top:10px }
        .progress div{ height:100%; background:linear-gradient(90deg,var(--blue),#00c6ff); border-radius:100px; transition:width .3s }
        .modal{ display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.25); backdrop-filter:blur(12px); padding:14px; overflow:auto }
        .modal.show{ display:block }
        .modal-box{ max-width:700px; margin:28px auto; background:#fff; border:1px solid #e4e6eb; border-radius:28px; padding:20px; box-shadow:0 24px 64px rgba(0,0,0,.15) }
        .modal-box.game-modal{ max-width:720px; background:linear-gradient(180deg,#ffffff 0%, #f8fafc 100%); }
        .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px }
        .modal-header h2{ margin:0; font-size:19px; font-weight:800; letter-spacing:-.4px }
        .close{ width:36px; height:36px; border-radius:100px; background:#f0f2f5; color:#65676b; font-size:20px; display:grid; place-items:center }
        input,textarea,select{ width:100%; border:1.5px solid #d8dadf; background:#fff; color:var(--text); padding:13px 14px; border-radius:14px; outline:none; transition:.15s; font-weight:500 }
        input:focus,textarea:focus,select:focus{ border-color:var(--blue); box-shadow:0 0 0 4px rgba(8,102,255,.12) }
        textarea{ min-height:100px; resize:vertical }
        .form-group{ margin-bottom:12px }
        .form-group label{ display:block; color:var(--sub); font-size:11px; margin-bottom:6px; font-weight:700; letter-spacing:.3px; text-transform:uppercase }
        .btn{ width:100%; padding:14px; border-radius:14px; color:#fff; font-weight:800; letter-spacing:-.2px; margin-top:8px }
        .btn-blue{background:var(--blue)} .btn-green{background:#00a86b} .btn-purple{background:#7c3aed} .btn-gray{background:#65676b} .btn-red{background:#e11d48} .btn-orange{background:#ea580c}
        .ai-box{ background:#f6f7f9; border:1px solid #eef0f3; border-radius:20px; padding:16px; margin-bottom:12px }
        .ai-big-score{ text-align:center; padding:8px }
        .ai-big-score .number{ font-size:56px; font-weight:900; letter-spacing:-2px; color:var(--blue) }
        .ai-big-score .text{ color:var(--sub); font-weight:600 }
        .analysis-item{ padding:13px 14px; margin-top:10px; border-radius:14px; background:#fff; border:1px solid #e4e6eb; line-height:1.6; font-size:13px }
        .list-item{ display:flex; align-items:center; gap:10px; padding:14px 0; border-bottom:1px solid #eef0f3 }
        .list-item:last-child{ border-bottom:0 }
        .list-main{ flex:1 }
        .list-title{ font-weight:700 }
        .list-sub{ color:var(--sub); font-size:11px; margin-top:3px; font-weight:500 }
        .delete{ width:32px; height:32px; border-radius:10px; background:#fef2f2; color:#e11d48; display:grid; place-items:center; flex-shrink:0 }
        .empty{ text-align:center; color:#8a8d91; padding:26px 10px; font-size:13px; font-weight:500 }
        .month-selector{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:#f6f7f9; border:1px solid #eef0f3; border-radius:18px; padding:8px; margin-bottom:14px }
        .month-selector button{ width:42px; height:42px; border-radius:12px; background:#fff; color:#111827; font-size:20px; font-weight:800; border:1px solid var(--line) }
        .month-center{ flex:1; text-align:center }
        .month-label{ font-size:18px; font-weight:900; letter-spacing:-.5px }
        .month-total{ font-size:12px; color:var(--sub); margin-top:3px; font-weight:600 }
        .current-month-btn{ width:100%; padding:10px; border-radius:12px; background:var(--blue-soft); color:var(--blue); font-weight:800; margin-bottom:12px }
        .today-schedule-box{ background:linear-gradient(135deg,#f5f3ff,#ede9fe); border:1px solid #ddd6fe; border-radius:18px; padding:15px; margin-bottom:15px }
        .today-schedule-title{ display:flex; justify-content:space-between; align-items:center; color:#5b21b6; font-weight:800; font-size:14px }
        .today-schedule-item{ background:#fff; border:1px solid #e9d5ff; border-radius:13px; padding:11px 12px; margin-top:8px; font-size:13px; font-weight:700 }
        .no-schedule{ color:#8a8d91; font-size:12px; margin-top:8px; text-align:center }
        .today-life-card{ background:linear-gradient(135deg,#ffffff,#f8fafc); border:1px solid var(--line); padding:18px; border-radius:22px; box-shadow:var(--shadow) }
        .today-block{ margin-top:14px; padding:13px; border-radius:16px }

        .today-block.todo{ background:#eff6ff; border:1px solid #dbeafe }
        .today-block-title{ font-size:12px; font-weight:800; margin-bottom:7px }
        .today-line{ font-size:12px; padding:5px 0; line-height:1.45 }
        .calc-screen{ background:#111827; color:#fff; text-align:right; padding:18px 20px; border-radius:18px; margin-bottom:12px }
        .calc-formula{ font-size:13px; color:#9ca3af; min-height:18px; word-break:break-all }
        .calc-value{ font-size:32px; font-weight:800; margin-top:4px; letter-spacing:-.5px; word-break:break-all }
        .calc-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px }
        .calc-btn{ height:54px; border-radius:14px; font-size:18px; font-weight:700; background:#f0f2f5; color:#111827 }
        .calc-btn.op{ background:#e7f0ff; color:var(--blue) }

        .calc-btn.equal{ background:var(--blue); color:#fff }
        .bottom{ position:fixed; bottom:0; left:0; right:0; height:72px; padding-bottom:env(safe-area-inset-bottom); z-index:50; background:rgba(255,255,255,.88); backdrop-filter:blur(20px); border-top:1px solid #e4e6eb; display:flex; justify-content:center }
        .bottom-inner{ width:100%; max-width:720px; display:grid; grid-template-columns:repeat(4,1fr) }
        .bottom button{ background:none; color:#8a8d91; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px }
        .bottom button.active{ color:var(--blue) }
        .bottom .ico{ width:24px; height:24px }
        .bottom span:last-child{ font-size:10px; font-weight:700 }

        .tetris-stat span{ display:block; font-size:10px; font-weight:800; color:var(--sub); letter-spacing:.4px }
        .tetris-stat b{ display:block; font-size:18px; font-weight:900; margin-top:2px; letter-spacing:-.4px }
        .tetris-main{ display:grid; grid-template-columns:1fr 128px; gap:12px; align-items:start }
        .tetris-board-wrap{ position:relative; background:#111827; border-radius:18px; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,.18) }
        .tetris-board{ display:grid; grid-template-columns:repeat(10,1fr); gap:1px; background:#1f2937; border-radius:12px; overflow:hidden; aspect-ratio:10/20 }
        .t-cell{ aspect-ratio:1; background:#0f172a; position:relative; display:grid; place-items:center }
        .t-cell-inner{ width:86%; height:86%; border-radius:5px; transition:.08s }
        .t-overlay{ position:absolute; inset:8px; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); border-radius:12px; display:grid; place-items:center; z-index:5 }
        .t-overlay-card{ background:#fff; border-radius:18px; padding:18px 20px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,.25); min-width:180px }
        .t-overlay-card.gameover{ min-width:210px }
        .tetris-side{ display:flex; flex-direction:column; gap:10px }
        .t-panel{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:16px; padding:12px }
        .t-panel-title{ font-size:11px; font-weight:800; color:var(--sub); letter-spacing:.4px; margin-bottom:8px }
        .t-how{ font-size:11px; line-height:1.5; color:#475569; font-weight:600 }
        .t-controls{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:4px }
        .t-ctrl{ height:52px; border-radius:14px; background:#f0f2f5; color:#111827; font-weight:900; font-size:18px; border:1px solid #e4e6eb; display:grid; place-items:center; transition:.12s }
        .t-ctrl:active{ transform:scale(.94); background:#e4e6eb }
        .t-ctrl.primary{ background:#e0f2fe; color:#0369a1; border-color:#bae6fd }
        .t-ctrl.drop{ background:#111827; color:#fff; font-size:12px; letter-spacing:.5px }
        .card-tetris-dash{ padding:18px; background:radial-gradient(120% 120% at 0% 0%,#a5f3fc 0%,#38bdf8 55%,#0ea5e9 100%); color:#083344; box-shadow:0 8px 28px rgba(14,165,233,.28); border:1px solid rgba(255,255,255,.5) }
        .tetris-dash-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px }
        .tetris-dash-stat{ background:rgba(255,255,255,.75); backdrop-filter:blur(8px); border-radius:12px; padding:10px 12px; text-align:center }
        .tetris-dash-stat span{ display:block; font-size:10px; font-weight:800; opacity:.7 }
        .tetris-dash-stat b{ display:block; font-size:18px; font-weight:900; margin-top:2px }
        /* Snake */
        .snake-root{ display:flex; flex-direction:column; gap:10px }
        .snake-board-wrap{ position:relative; background:#111827; border-radius:18px; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,.18) }
        .snake-board{ display:grid; gap:1px; background:#1f2937; border-radius:12px; overflow:hidden; aspect-ratio:1 }
        .s-cell{ background:#0f172a; aspect-ratio:1; display:grid; place-items:center }
        .s-head{ width:84%; height:84%; background:linear-gradient(135deg,#4ade80,#22c55e); border-radius:6px; box-shadow:0 0 8px rgba(34,197,94,.6) }
        .s-body{ width:74%; height:74%; background:#86efac; border-radius:5px; opacity:.9 }
        .s-food{ width:68%; height:68%; background:radial-gradient(circle,#f87171,#ef4444); border-radius:50%; box-shadow:0 0 10px rgba(239,68,68,.7); animation: pulse 1s infinite }
        @keyframes pulse{ 0%,100%{ transform:scale(1)} 50%{ transform:scale(1.15)} }
        .snake-dpad{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:200px; margin:6px auto 0 }
        .dpad-btn{ height:46px; border-radius:14px; background:#f0f2f5; border:1px solid #e4e6eb; font-weight:900; font-size:16px; display:grid; place-items:center }
        .dpad-btn:active{ transform:scale(.94); background:#e4e6eb }
        /* 2048 */
        .c2048-root{ display:flex; flex-direction:column; gap:10px }
        .c2048-board-wrap{ position:relative; background:#bbada0; border-radius:18px; padding:8px }
        .c2048-board{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; background:#bbada0; border-radius:12px }
        .c2048-cell{ aspect-ratio:1; background:#cdc1b4; border-radius:8px; display:grid; place-items:center }
        .c2048-tile{ width:100%; height:100%; border-radius:8px; display:grid; place-items:center; font-weight:900; transition: all .12s; box-shadow:inset 0 -3px 0 rgba(0,0,0,.1) }
        /* Breakout */
        .breakout-root{ display:flex; flex-direction:column; gap:10px }
        .breakout-canvas-wrap{ position:relative; background:#0f172a; border-radius:18px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.18) }
        /* Game Center */
        .game-center-root{ display:flex; flex-direction:column; gap:12px }
        .gc-header{ display:flex; justify-content:space-between; align-items:center }
        .gc-back{ background:#f0f2f5; color:#111827; padding:8px 14px; border-radius:100px; font-weight:800; font-size:13px }
        .gc-title{ font-size:16px; font-weight:900; letter-spacing:-.3px }
        .gc-hero{ display:flex; justify-content:space-between; align-items:center; background:radial-gradient(120% 120% at 0% 0%,#0f172a,#1e293b); color:#fff; padding:18px; border-radius:22px; box-shadow:0 8px 28px rgba(15,23,42,.3) }
        .gc-hero-title{ font-size:18px; font-weight:900; letter-spacing:-.5px }
        .gc-hero-sub{ font-size:11px; opacity:.7; margin-top:3px; font-weight:700; letter-spacing:.4px }
        .gc-hero-stats{ display:flex; gap:14px; margin-top:12px }
        .gc-hero-stats div{ background:rgba(255,255,255,.1); padding:8px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.1) }
        .gc-hero-stats span{ display:block; font-size:10px; opacity:.7; font-weight:700 }
        .gc-hero-stats b{ display:block; font-size:15px; font-weight:900; margin-top:2px }
        .gc-hero-icon{ font-size:42px }
        .gc-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px }
        .gc-card{ border-radius:22px; padding:16px; position:relative; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.08); border:1px solid rgba(255,255,255,.5); transition:.18s }
        .gc-card:hover{ transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,.12) }
        .gc-card-top{ display:flex; justify-content:space-between; align-items:center }
        .gc-card-icon{ width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.8); display:grid; place-items:center; font-size:20px; box-shadow:0 2px 8px rgba(0,0,0,.08) }
        .gc-card-best{ font-size:10px; font-weight:900; background:rgba(255,255,255,.75); padding:4px 8px; border-radius:100px }
        .gc-card-title{ font-size:15px; font-weight:900; margin-top:12px; letter-spacing:-.3px }
        .gc-card-desc{ font-size:11px; opacity:.75; margin-top:3px; font-weight:600; line-height:1.3 }
        .gc-card-scores{ display:flex; gap:8px; margin-top:10px }
        .gc-mini-stat{ flex:1; background:rgba(255,255,255,.7); border-radius:10px; padding:6px 8px; text-align:center }
        .gc-mini-stat span{ display:block; font-size:9px; font-weight:800; opacity:.6 }
        .gc-mini-stat b{ display:block; font-size:13px; font-weight:900; margin-top:1px }
        .gc-play-btn{ width:100%; margin-top:10px; background:#111827; color:#fff; padding:10px; border-radius:12px; font-weight:900; font-size:13px; letter-spacing:-.2px }
        .gc-footer-tip{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:16px; padding:14px }
        .gc-dash-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px }
        .gc-dash-item{ background:rgba(255,255,255,.8); border-radius:12px; padding:8px; text-align:center }
        .gc-dash-item span{ display:block; font-size:9px; font-weight:800; opacity:.6 }
        .gc-dash-item b{ display:block; font-size:12px; font-weight:900; margin-top:2px }
        @media(max-width:560px){
          .tetris-main{ grid-template-columns:1fr; }
          .tetris-side{ order:-1; display:grid; grid-template-columns:1fr 1fr; }
          .tetris-side .t-panel{ padding:10px }
          .t-controls{ grid-template-columns:repeat(5,1fr) }
          .gc-grid{ grid-template-columns:1fr 1fr }
        }
        @media(max-width:430px){
         .header{ padding-left:16px; padding-right:16px }
         .logo{ font-size:21px }
         .subtitle{ font-size:11px }
         .date-pill{ font-size:10px; padding:6px 9px }
         .menu{ gap:8px; padding:0 12px }
         .menu-item-btn{ min-height:100px }
         .stat .value{ font-size:18px }
         .modal-box{ margin:12px auto; border-radius:24px; padding:17px }
         .gc-grid{ gap:8px }
         .gc-card{ padding:13px }
         .gc-dash-grid{ grid-template-columns:repeat(2,1fr) }
        }
