<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MY LIFE OS — Meta Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#f6f7f9;
 --card:#ffffff;
 --line:#e4e6eb;
 --text:#050505;
 --sub:#65676b;
 --blue:#0866ff;
 --blue-soft:#f0f6ff;
 --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
 --shadow-hover:0 4px 12px rgba(0,0,0,.08),0 16px 40px rgba(0,0,0,.08);
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:108px}
.header{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-size:24px;font-weight:900;letter-spacing:-.8px}
.logo span{color:var(--blue)}
.subtitle{color:var(--sub);font-size:13px;margin-top:4px;font-weight:500}
.date-pill{background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:100px;font-size:12px;font-weight:700;color:var(--sub);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.section-title{padding:0 20px;margin:22px 0 12px;font-size:14px;font-weight:800;letter-spacing:-.2px;display:flex;justify-content:space-between;align-items:center}
.section-title small{font-weight:600;color:var(--sub);font-size:11px}
.dash-board{margin:0 16px 18px;padding:14px;border:1.5px dashed #d0d7de;border-radius:24px;background:rgba(255,255,255,.7);backdrop-filter:blur(20px);min-height:112px;display:flex;flex-direction:column;gap:12px;transition:.2s}
.dash-board.drag-over{background:var(--blue-soft);border-color:var(--blue);border-style:solid}
.dash-board-empty{text-align:center;color:#8a8d91;font-size:13px;padding:26px 10px;line-height:1.6;font-weight:500}
.dash-board-empty b{color:var(--text)}
.drag-card{position:relative;border-radius:22px;cursor:grab;transition:transform .18s,box-shadow .18s}
.drag-card:active{cursor:grabbing;transform:scale(.98)}
.drag-card.dragging{opacity:.4}
.card-remove-btn{position:absolute;top:10px;right:10px;background:rgba(240,242,245,0.85);color:#65676b;border-radius:100px;padding:5px 10px;font-size:11px;font-weight:700;z-index:5;backdrop-filter:blur(4px)}
.card-remove-btn:hover{background:#fee2e2;color:#dc2626}
.card-ai{padding:20px;background:radial-gradient(120% 120% at 10% 0%,#3b82f6 0%,#0866ff 55%,#0047d1 100%);color:#fff;box-shadow:0 8px 28px rgba(8,102,255,.28)}
.card-expense-dash{padding:18px;background:radial-gradient(120% 120% at 0% 0%,#10b981 0%,#059669 100%);color:#fff;box-shadow:0 8px 28px rgba(5,150,105,.24)}
.card-todo-dash,.card-generic-dash{padding:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.greeting{color:#dbeafe;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.today{font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.4px}
.ai-mini{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18)}
.ai-title{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.ai-score{font-size:22px;font-weight:900}
.ai-summary{margin-top:6px;color:#eff6ff;font-size:12px;line-height:1.5;opacity:.95}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.menu-item-btn{position:relative;min-height:108px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--text);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer}
.menu-item-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.menu-item-btn:active{transform:scale(.97)}
.menu-item-btn.is-placed{border:2px solid var(--blue);background:var(--blue-soft)}
.icon-wrap{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.icon-wrap svg{width:24px;height:24px}
.label{font-size:12.5px;font-weight:700;letter-spacing:-.2px}
.menu-pin-badge{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:100px;background:var(--blue);color:#fff;display:grid;place-items:center}
.menu-add-btn{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:100px;background:#f0f2f5;color:#65676b;display:grid;place-items:center}
.card{margin:0 16px 14px;padding:18px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#f6f7f9;border:1px solid #eef0f3;padding:14px 15px;border-radius:16px}
.stat .name{color:var(--sub);font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.stat .value{font-size:21px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
.row{display:flex;justify-content:space-between;align-items:center}
.progress{height:8px;background:#e4e6eb;border-radius:100px;overflow:hidden;margin-top:10px}
.progress div{height:100%;background:linear-gradient(90deg,var(--blue),#00c6ff);border-radius:100px;transition:width .3s}
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.25);backdrop-filter:blur(12px);padding:14px;overflow:auto}
.modal.show{display:block}
.modal-box{max-width:700px;margin:28px auto;background:#fff;border:1px solid #e4e6eb;border-radius:28px;padding:20px;box-shadow:0 24px 64px rgba(0,0,0,.15)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-header h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}
.close{width:36px;height:36px;border-radius:100px;background:#f0f2f5;color:#65676b;font-size:20px;display:grid;place-items:center}
input,textarea,select{width:100%;border:1.5px solid #d8dadf;background:#fff;color:var(--text);padding:13px 14px;border-radius:14px;outline:none;transition:.15s;font-weight:500}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(8,102,255,.12)}
textarea{min-height:100px;resize:vertical}
.form-group{margin-bottom:12px}
.form-group label{display:block;color:var(--sub);font-size:11px;margin-bottom:6px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.btn{width:100%;padding:14px;border-radius:14px;color:#fff;font-weight:800;letter-spacing:-.2px;margin-top:8px}
.btn-blue{background:var(--blue)} .btn-green{background:#00a86b} .btn-purple{background:#7c3aed} .btn-gray{background:#65676b} .btn-red{background:#e11d48}
.ai-box{background:#f6f7f9;border:1px solid #eef0f3;border-radius:20px;padding:16px;margin-bottom:12px}
.ai-big-score{text-align:center;padding:8px}
.ai-big-score .number{font-size:56px;font-weight:900;letter-spacing:-2px;color:var(--blue)}
.ai-big-score .text{color:var(--sub);font-weight:600}
.analysis-item{padding:13px 14px;margin-top:10px;border-radius:14px;background:#fff;border:1px solid #e4e6eb;line-height:1.6;font-size:13px}
.list-item{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #eef0f3}
.list-item:last-child{border-bottom:0}
.list-main{flex:1}
.list-title{font-weight:700}
.list-sub{color:var(--sub);font-size:11px;margin-top:3px;font-weight:500}
.delete{width:32px;height:32px;border-radius:10px;background:#fef2f2;color:#e11d48;display:grid;place-items:center}
.calc-screen{background:#111827;color:#fff;text-align:right;padding:18px 20px;border-radius:18px;margin-bottom:12px}
.calc-formula{font-size:13px;color:#9ca3af;min-height:18px;word-break:break-all}
.calc-value{font-size:32px;font-weight:800;margin-top:4px;letter-spacing:-.5px;word-break:break-all}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-btn{height:54px;border-radius:14px;font-size:18px;font-weight:700;background:#f0f2f5;color:#111827}
.calc-btn.op{background:#e7f0ff;color:var(--blue)} .calc-btn.action{background:#fee2e2;color:#e11d48} .calc-btn.equal{background:var(--blue);color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;padding-bottom:env(safe-area-inset-bottom);z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border-top:1px solid #e4e6eb;display:flex;justify-content:center}
.bottom-inner{width:100%;max-width:720px;display:grid;grid-template-columns:repeat(4,1fr)}
.bottom button{background:none;color:#8a8d91;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bottom button.active{color:var(--blue)}
.bottom .ico{width:24px;height:24px}
.bottom span:last-child{font-size:10px;font-weight:700}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(16px);background:#111827;color:#fff;padding:12px 18px;border-radius:100px;opacity:0;pointer-events:none;transition:.28s;z-index:300;white-space:nowrap;font-size:13px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:#8a8d91;padding:26px 10px;font-size:13px;font-weight:500}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div><div class="logo">MY LIFE <span>OS</span></div><div class="subtitle">나만의 생활 관리 · 분석 플랫폼</div></div>
<div class="date-pill" id="datePill"></div>
</header>
<div class="section-title"><span>📌 내 대시보드</span><small>끌어서 배치 · + 로 추가</small></div>
<div class="dash-board" id="dashBoard" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)"></div>
<div class="section-title"><span>빠른 메뉴</span><small>아이콘을 꾹 눌러 상단으로 드래그</small></div>
<div class="menu" id="quickMenu"></div>
<div class="section-title">오늘의 현황</div>
<div class="card">
<div class="stat-grid">
<div class="stat"><div class="name">이번 달 청구 지출</div><div class="value" id="expenseTotal">0원</div></div>
<div class="stat"><div class="name">완료한 할 일</div><div class="value" id="todoDone">0</div></div>
<div class="stat"><div class="name">진행 목표</div><div class="value" id="goalProgress">0%</div></div>
<div class="stat"><div class="name">메모</div><div class="value" id="memoCount">0</div></div>
</div>
</div>
<div class="section-title">오늘의 할 일</div>
<div class="card" id="todayTodo"><div class="empty">등록된 할 일이 없습니다.</div></div>
</div>
<div class="bottom"><div class="bottom-inner">
<button class="active" onclick="scrollTopPage()"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>홈</span></button>
<button onclick="openAI()"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4Z"/><path d="M8 10h8"/><path d="M8 14h8"/><path d="M9 18h6"/></svg></span><span>AI</span></button>
<button onclick="openModal('memo')"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span><span>메모</span></button>
<button onclick="openModal('settings')"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 2 2 0 0 1-2 0 1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82-.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 8.6 15a1.65 1.65 0 0 0-.6-1 2 2 0 0 1 0-2c.18-.36.42-.68.6-1A1.65 1.65 0 0 0 8.27 9.18l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 12.9 6.6a1.65 1.65 0 0 0 1-.6 2 2 0 0 1 2 0c.36.18.68.42 1 .6a1.65 1.65 0 0 0 1.82.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 15.4 11.4a1.65 1.65 0 0 0 .6 1 2 2 0 0 1 0 2c-.18.36-.42.68-.6 1Z"/></svg></span><span>설정</span></button>
</div></div>
<div class="modal" id="modal" onclick="handleModalBgClick(event)" aria-modal="true" role="dialog"><div class="modal-box"><div class="modal-header"><h2 id="modalTitle">메뉴</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalContent"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const DB_KEY="MY_LIFE_OS_DATABASE_V1";
let db=loadDB(); 
let calcDisplay="0"; 
let calcLastValue=0; 
let isCalcEvaluated=false;
let draggedCardId=null;

const ICONS={
 ai:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.937A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063A2 2 0 0 0 14.063 15.5l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v5"/><path d="M5 19H2"/></svg>`,
 expense:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-9"/></svg>`,
 todo:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
 schedule:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
 goal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,
 shopping:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`,
 memo:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
 items:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,
 calculator:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/></svg>`
};

const COLORS={
 ai:'linear-gradient(135deg,#e0f2fe,#dbeafe)',expense:'linear-gradient(135deg,#dcfce7,#d1fae5)',todo:'linear-gradient(135deg,#fef9c3,#fef08a)',schedule:'linear-gradient(135deg,#e0e7ff,#c7d2fe)',goal:'linear-gradient(135deg,#f3e8ff,#e9d5ff)',shopping:'linear-gradient(135deg,#ffedd5,#fed7aa)',memo:'linear-gradient(135deg,#f3f4f6,#e5e7eb)',items:'linear-gradient(135deg,#fce7f3,#fbcfe8)',calculator:'linear-gradient(135deg,#f1f5f9,#e2e8f0)'
};

const MENU_LIST=[
 {id:"ai",label:"AI 분석",action:openAI},
 {id:"expense",label:"가계부",action:()=>openModal('expense')},
 {id:"todo",label:"할 일",action:()=>openModal('todo')},
 {id:"schedule",label:"일정",action:()=>openModal('schedule')},
 {id:"goal",label:"목표",action:()=>openModal('goal')},
 {id:"shopping",label:"장보기",action:()=>openModal('shopping')},
 {id:"memo",label:"메모",action:()=>openModal('memo')},
 {id:"items",label:"물건관리",action:()=>openModal('items')},
 {id:"calculator",label:"계산기",action:()=>openModal('calculator')}
];

function defaultDB(){return{placedCardIds:["ai","expense"],expenses:[],todos:[],schedules:[],goals:[],shopping:[],memos:[],items:[]}}
function loadDB(){try{const d=localStorage.getItem(DB_KEY);if(d){const p=JSON.parse(d);if(!p.placedCardIds)p.placedCardIds=["ai","expense"];p.placedCardIds=p.placedCardIds.filter(id=>id!=='fortune');return{...defaultDB(),...p}}}catch(e){}return defaultDB()}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db));updateDashboard()}
function money(n){return Number(n||0).toLocaleString("ko-KR")+"원"}
function today(){return new Date().toISOString().slice(0,10)}
function month(){return today().slice(0,7)}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}
function getTodayText(){const d=new Date();const days=["일","월","화","수","목","금","토"];return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`}

function calculateMonthlyExpense(targetMonth){
 const[tY,tM]=targetMonth.split('-').map(Number);
 let total=0;
 db.expenses.forEach(x=>{
  if(!x.date)return;
  const pay=x.payType||"cash";
  const[eY,eM]=x.date.slice(0,7).split('-').map(Number);
  const diff=(tY-eY)*12+(tM-eM);
  if(pay==="installment"){
   const ms=Number(x.installMonths)||1;
   if(diff>=0&&diff<ms)total+=Math.round(Number(x.amount)/ms);
  }else if(diff===0)total+=Number(x.amount);
 });
 return total;
}

function handleDragStart(e,id){draggedCardId=id;e.target.classList.add("dragging")}
function handleDragEnd(e){e.target.classList.remove("dragging")}
function handleDragOver(e){e.preventDefault();document.getElementById("dashBoard").classList.add("drag-over")}
function handleDragLeave(e){document.getElementById("dashBoard").classList.remove("drag-over")}
function handleDrop(e){
 e.preventDefault();
 document.getElementById("dashBoard").classList.remove("drag-over");
 if(!draggedCardId)return;
 if(!db.placedCardIds.includes(draggedCardId)){
  db.placedCardIds.push(draggedCardId);
  saveDB();
  toast("대시보드에 배치되었습니다");
 }
 draggedCardId=null;
}

function togglePlaceMenu(id,e){
 if(e)e.stopPropagation();
 if(db.placedCardIds.includes(id))removeCard(id,e);
 else placeCard(id);
}
function placeCard(id){
 if(!db.placedCardIds.includes(id)){
  db.placedCardIds.push(id);
  saveDB();
  toast("상단 대시보드에 배치되었습니다");
 }
}
function removeCard(id,e){
 if(e)e.stopPropagation();
 db.placedCardIds=db.placedCardIds.filter(c=>c!==id);
 saveDB();
 toast("대시보드에서 제거되었습니다");
}

function renderQuickMenu(){
 const el=document.getElementById("quickMenu");

function pressCalc(val){
 const d=document.getElementById("calcDisplay");
 const f=document.getElementById("calcFormula");
 const ops=['+','-','*','/','.'];

 if(val==='C'){
  calcDisplay="0";
  calcLastValue=0;
  isCalcEvaluated=false;
  if(f) f.textContent="";
  if(d) d.textContent="0";
  return;
 }

 if(isCalcEvaluated){
  if(!ops.includes(val)&&val!==')'){
   calcDisplay=val;
  }else{
   calcDisplay+=val;
  }
  isCalcEvaluated=false;
 }else{
  const last=calcDisplay.slice(-1);
  if(ops.includes(val)&&ops.includes(last)){
   calcDisplay=calcDisplay.slice(0,-1)+val;
  }else if(calcDisplay==="0"&&!isNaN(val)){
   calcDisplay=val;
  }else{
   calcDisplay+=val;
  }
 }

 if(f) f.textContent=calcDisplay;

 try{
  let exp=calcDisplay;
  while(exp.length>0&&ops.includes(exp.slice(-1))){
   exp=exp.slice(0,-1);
  }
  if(exp.length===0){
   if(d) d.textContent="0";
   calcLastValue=0;
  }else{
   const cleanExp=exp.replace(/[^0-9+\-*/().]/g,'');
   const res=Function('"use strict";return ('+cleanExp+')')();
   if(res!==undefined&&!isNaN(res)&&res!==Infinity){
    const rounded=Math.round(res*1e8)/1e8;
    if(d) d.textContent=Number(rounded).toLocaleString("ko-KR");
    calcLastValue=rounded;
   }
  }
 }catch(e){}
}

function calculate(){
 const d=document.getElementById("calcDisplay");
 const f=document.getElementById("calcFormula");
 try{
  const s=calcDisplay.replace(/[^0-9+\-*/().]/g,'');
  const r=Function('"use strict";return ('+s+')')();
  if(r===undefined||r===Infinity||isNaN(r)){
   if(d) d.textContent="오류";
   calcDisplay="0";
   calcLastValue=0;
  }else{
   const rr=Math.round(r*1e8)/1e8;
   if(f) f.textContent=calcDisplay+" =";
   if(d) d.textContent=Number(rr).toLocaleString("ko-KR");
   calcDisplay=String(rr);
   calcLastValue=rr;
   isCalcEvaluated=true;
  }
 }catch(e){
  if(d) d.textContent="오류";
  calcDisplay="0";
  calcLastValue=0;
 }
}

function sendCalcToExpense(){
 if(!isCalcEvaluated)calculate();
 if(calcLastValue<=0)return toast("0원 이상만 전달 가능합니다");
 openModal("expense",calcLastValue);
 toast(`${money(calcLastValue)}가 입력되었습니다`);
}

function AIAnalyze(){
 const cm=month();
 const total=calculateMonthlyExpense(cm);
 const cats={};
 db.expenses.forEach(x=>{
  let eff=0;
  const pay=x.payType||"cash";
  const ms=x.installMonths||1;
  const[eY,eM]=x.date.slice(0,7).split('-').map(Number);
  const[tY,tM]=cm.split('-').map(Number);
  const diff=(tY-eY)*12+(tM-eM);
  if(pay==="installment"){if(diff>=0&&diff<ms)eff=Math.round(Number(x.amount)/ms)}
  else if(diff===0)eff=Number(x.amount);
  if(eff>0)cats[x.category]=(cats[x.category]||0)+eff;
 });

 const todos=db.todos;
 const tt=todos.length;
 const td=todos.filter(x=>x.done).length;
 const tr=tt?Math.round(td/tt*100):0;

 const goals=db.goals;
 const gr=goals.length?Math.round(goals.reduce((s,x)=>s+Number(x.percent),0)/goals.length):0;

 let score=70;
 const findings=[];
 const advice=[];

 if(total===0){
  findings.push("아직 이번 달 소비 데이터가 기록되지 않았습니다.");
 }else{
  const ent=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const top=ent[0];
  if(top){
   const ratio=Math.round(top[1]/total*100);
   findings.push(`이번 달 청구 지출 중 가장 큰 항목은 <strong>${esc(top[0])}</strong>이며 전체의 ${ratio}%를 차지합니다.`);
   if(ratio>=40){score-=8;advice.push(`${top[0]} 지출 비중이 높습니다. 예산을 점검해보세요.`)}
   else score+=3;
  }
  if(total>=3000000){score-=10;advice.push("월 예상 지출 규모가 큽니다. 고정비를 줄일 요소가 있는지 확인해 보세요.")}
 }

 if(tt===0){
  findings.push("등록된 할 일이 없어 실행률을 산정하지 못했습니다.");
 }else{
  findings.push(`오늘/전체 할 일 완료율은 <strong>${tr}%</strong>입니다.`);
  if(tr>=80){score+=8;advice.push("할 일 관리가 양호합니다. 현재 페이스를 유지해 보세요.")}
  else if(tr<50){score-=8;advice.push("미완료된 할 일이 누적되고 있습니다. 시급한 일부터 분할 처리하세요.")}
 }

 if(goals.length){
  findings.push(`목표 평균 달성률은 <strong>${gr}%</strong>입니다.`);
  if(gr>=80)score+=8;
  else if(gr<40){score-=7;advice.push("목표 단계를 더 작게 나누면 달성률을 끌어올릴 수 있습니다.")}
 }

 if(db.memos.length>=5)findings.push(`현재 총 ${db.memos.length}개의 메모가 저장되어 있습니다.`);

 if(db.expenses.length===0&&tt===0&&goals.length===0){
  score=60;
  advice.push("가계부, 할 일, 목표를 지속해서 입력하면 분석 정확도가 크게 높아집니다.");
 }

 score=Math.max(0,Math.min(100,Math.round(score)));
 let status=score>=85?"매우 좋음":score>=70?"양호":score>=55?"보통":"관리 필요";
 return{score,status,total,todoRate:tr,goalRate:gr,findings,advice};
}

function openAI(){
 const r=AIAnalyze();
 openModal('ai');
 document.getElementById("modalTitle").textContent="AI 생활분석";
 document.getElementById("modalContent").innerHTML=`<div class="ai-box">
  <div class="ai-big-score"><div class="number">${r.score}</div><div class="text">생활지수 · ${r.status}</div></div>
 </div>
 <div class="stat-grid">
  <div class="stat"><div class="name">이번 달 예상 청구액</div><div class="value">${money(r.total)}</div></div>
  <div class="stat"><div class="name">할 일 완료율</div><div class="value">${r.todoRate}%</div></div>
  <div class="stat"><div class="name">목표 달성률</div><div class="value">${r.goalRate}%</div></div>
  <div class="stat"><div class="name">저장 데이터</div><div class="value">${db.expenses.length+db.todos.length+db.memos.length}</div></div>
 </div>
 <div class="section-title" style="padding:0;margin-top:20px">🔍 AI가 발견한 패턴</div>
 <div class="ai-box">${r.findings.length?r.findings.map(x=>`<div class="analysis-item">${x}</div>`).join(""):`<div class="empty">분석할 데이터가 없습니다.</div>`}</div>
 <div class="section-title" style="padding:0">💡 AI 생활 제안</div>
 <div class="ai-box">${r.advice.length?r.advice.map(x=>`<div class="analysis-item">💡 ${x}</div>`).join(""):`<div class="analysis-item">현재 생활 패턴이 매우 안정적입니다.</div>`}</div>
 <button class="btn btn-blue" onclick="openAI()">🔄 다시 분석</button>`;
}

function settingsHTML(){
 return `<div class="ai-box"><strong>MY LIFE OS 데이터</strong><div class="list-sub" style="margin-top:8px">모든 데이터는 브라우저 LocalStorage에 안전하게 저장됩니다.</div></div>
 <button class="btn btn-blue" onclick="exportData()">📤 데이터 백업</button>
 <button class="btn btn-gray" onclick="document.getElementById('importFile').click()">📥 데이터 복원</button>
 <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
 <button class="btn btn-red" onclick="resetData()">🗑 전체 데이터 삭제</button>`;
}

function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="MY_LIFE_OS_BACKUP_"+today()+".json";
 a.click();
 URL.revokeObjectURL(url);
 toast("백업 파일을 다운로드했습니다");
}

function importData(e){
 const f=e.target.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   db={...defaultDB(),...d};
   saveDB();
   toast("성공적으로 복원되었습니다");
   setTimeout(()=>openModal("settings"),300);
  }catch(err){alert("올바르지 않은 백업 파일 형식입니다.")}
 };
 r.readAsText(f);
}

function resetData(){
 if(!confirm("모든 데이터가 초기화됩니다.\n정말 완전히 삭제하시겠습니까?"))return;
 db=defaultDB();
 saveDB();
 closeModal();
 toast("모든 데이터가 초기화되었습니다");
}

function updateDashboard(){
 const cm=month();
 const total=calculateMonthlyExpense(cm);
 document.getElementById("expenseTotal").textContent=money(total);
 document.getElementById("todoDone").textContent=db.todos.filter(x=>x.done).length;
 const gr=db.goals.length?Math.round(db.goals.reduce((s,x)=>s+Number(x.percent),0)/db.goals.length):0;
 document.getElementById("goalProgress").textContent=gr+"%";
 document.getElementById("memoCount").textContent=db.memos.length;
 document.getElementById("datePill").textContent=getTodayText();
 renderQuickMenu();
 renderDashCards();
 renderTodayTodo();
}

function renderTodayTodo(){
 const box=document.getElementById("todayTodo");
 const list=db.todos.filter(x=>x.date===today()&&!x.done);
 if(!list.length){box.innerHTML=`<div class="empty">오늘 남은 할 일이 없습니다. 🎉</div>`;return}
 box.innerHTML=list.map(x=>`<div class="list-item"><div class="list-main"><div class="list-title">${esc(x.text)}</div><div class="list-sub">오늘의 할 일</div></div></div>`).join("");
}

function scrollTopPage(){window.scrollTo({top:0,behavior:"smooth"})}

updateDashboard();
window.addEventListener("beforeunload",saveDB);
</script>
