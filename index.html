<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MY LIFE OS</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    /* 밝은 테마 컬러 팔레트 */
    --bg:#f4f7fc;
    --card:#ffffff;
    --card2:#f8fafc;
    --line:#e2e8f0;
    --text:#1e293b;
    --sub:#64748b;
    --blue:#2563eb;
    --green:#16a34a;
    --yellow:#d97706;
    --red:#dc2626;
    --purple:#7c3aed;
    --cyan:#0891b2;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top right,#e0f2fe 0,#f4f7fc 45%),
        var(--bg);
    color:var(--text);
    font-family:
        -apple-system,BlinkMacSystemFont,
        "Noto Sans KR",sans-serif;
    user-select: none;
}

button,input,textarea,select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    max-width:720px;
    margin:auto;
    min-height:100vh;
    padding-bottom:90px;
}

/* HEADER */

.header{
    padding:24px 18px 10px;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#0f172a;
}

.logo span{
    color:var(--blue);
}

.subtitle{
    color:var(--sub);
    font-size:13px;
    margin-top:5px;
}

/* SECTION TITLE */

.section-title{
    padding:0 17px;
    margin:18px 0 10px;
    font-size:15px;
    font-weight:800;
    color:#0f172a;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* DASHBOARD BOARD (TARGET ZONE) */

.dash-board {
    margin: 0 15px 15px;
    padding: 12px;
    border: 2px dashed #cbd5e1;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.6);
    min-height: 110px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: background 0.2s, border-color 0.2s;
}

.dash-board.drag-over {
    background: #e0f2fe;
    border-color: var(--blue);
}

.dash-board-empty {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    padding: 25px 10px;
    line-height: 1.5;
}

/* DRAGGABLE DASHBOARD CARDS */

.drag-card {
    position: relative;
    border-radius: 20px;
    cursor: grab;
    transition: transform 0.15s, box-shadow 0.15s;
    touch-action: manipulation;
}

.drag-card:active {
    cursor: grabbing;
    transform: scale(0.98);
}

.drag-card.dragging {
    opacity: 0.4;
}

.card-remove-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0, 0, 0, 0.2);
    color: #ffffff;
    border-radius: 10px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: bold;
    z-index: 5;
}

/* CARD STYLES */

.card-ai {
    padding: 20px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #ffffff;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
}

.card-expense-dash {
    padding: 18px;
    background: linear-gradient(135deg, #059669, #10b981);
    color: #ffffff;
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
}

.card-todo-dash {
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
}

.card-generic-dash {
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
}

.greeting{ color:#bfdbfe; font-size:12px; }
.today{ font-size:20px; font-weight:900; margin-top:2px; }
.ai-mini{
    margin-top:12px;
    padding:12px;
    border-radius:15px;
    background:rgba(255, 255, 255, 0.15);
    backdrop-filter:blur(10px);
}
.ai-title{ display:flex; justify-content:space-between; align-items:center; }
.ai-score{ font-size:22px; font-weight:900; }
.ai-summary{ margin-top:6px; color:#eff6ff; font-size:12px; line-height:1.5; }

/* MENU */

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:0 15px;
}

.menu .menu-item-btn {
    position: relative;
    min-height:92px;
    border-radius:18px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:6px;
    transition:.15s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    cursor: grab;
    touch-action: manipulation;
}

.menu .menu-item-btn:active{
    transform:scale(.96);
    background:#f1f5f9;
}

.menu .menu-item-btn.is-placed {
    border: 2px solid var(--blue);
    background: #f0f7ff;
}

.menu .icon{ font-size:26px; }
.menu .label{ font-size:12px; font-weight:600; }

.menu-pin-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 10px;
    background: var(--blue);
    color: white;
    padding: 2px 5px;
    border-radius: 6px;
    font-weight: bold;
}

.menu-add-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 11px;
    background: #e2e8f0;
    color: var(--sub);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* STAT CARD */

.card{
    margin:0 15px 13px;
    padding:17px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:15px;
    border-radius:16px;
}

.stat .name{ color:var(--sub); font-size:12px; }
.stat .value{ font-size:22px; font-weight:900; margin-top:5px; color:#0f172a; }

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.progress{
    height:9px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
    margin-top:9px;
}

.progress div{
    height:100%;
    background:linear-gradient(90deg,#2563eb,#16a34a);
    border-radius:20px;
}

/* MODAL & OTHERS */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(15, 23, 42, 0.4);
    backdrop-filter:blur(6px);
    padding:15px;
    overflow:auto;
}

.modal.show{ display:block; }

.modal-box{
    max-width:700px;
    margin:30px auto;
    background:#ffffff;
    border:1px solid #e2e8f0;
    border-radius:24px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0, 0, 0, 0.1);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modal-header h2{
    margin:0;
    font-size:20px;
    color:#0f172a;
}

.close{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#f1f5f9;
    color:#64748b;
    font-size:20px;
}

input,textarea,select{
    width:100%;
    border:1px solid #cbd5e1;
    background:#ffffff;
    color:#0f172a;
    padding:13px;
    border-radius:13px;
    outline:none;
}

input:focus, textarea:focus, select:focus{
    border-color:var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.form-group{ margin-bottom:12px; }
.form-group label{ display:block; color:var(--sub); font-size:12px; margin-bottom:6px; font-weight:600; }

.btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    color:white;
    font-weight:800;
    margin-top:7px;
}

.btn-blue{ background:linear-gradient(135deg,#2563eb,#3b82f6); }
.btn-purple{ background:linear-gradient(135deg,#7c3aed,#8b5cf6); }
.btn-green{ background:linear-gradient(135deg,#16a34a,#22c55e); }
.btn-gray{ background:#64748b; }
.btn-red{ background:#dc2626; }

.ai-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:20px;
    padding:18px;
    margin-bottom:12px;
}

.ai-big-score{
    text-align:center;
    padding:10px;
}

.ai-big-score .number{
    font-size:58px;
    font-weight:900;
    color:var(--purple);
}

.ai-big-score .text{
    color:var(--sub);
}

.analysis-item{
    padding:13px;
    margin-top:9px;
    border-radius:14px;
    background:#ffffff;
    border:1px solid #e2e8f0;
    line-height:1.6;
    font-size:13px;
    color:var(--text);
}

.analysis-item strong{ color:#0f172a; }

.list-item{ display:flex; align-items:center; gap:10px; padding:13px 0; border-bottom:1px solid #e2e8f0; }
.list-item:last-child{ border-bottom:0; }
.list-main{ flex:1; }
.list-title{ font-weight:700; color:#0f172a; }
.list-sub{ color:var(--sub); font-size:11px; margin-top:3px; }
.delete{ width:34px; height:34px; border-radius:10px; background:#fef2f2; color:#dc2626; }

.bottom{
    position:fixed; bottom:0; left:0; right:0; height:68px; z-index:50;
    background:rgba(255, 255, 255, 0.9); backdrop-filter:blur(15px);
    border-top:1px solid #e2e8f0; display:flex; justify-content:center;
}

.bottom-inner{ width:100%; max-width:720px; display:grid; grid-template-columns:repeat(4,1fr); }
.bottom button{ background:none; color:#64748b; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
.bottom button.active{ color:var(--blue); }
.bottom span:first-child{ font-size:20px; }
.bottom span:last-child{ font-size:10px; font-weight:600; }

.toast{
    position:fixed; left:50%; bottom:85px; transform:translateX(-50%) translateY(20px);
    background:#0f172a; color:white; padding:12px 18px; border-radius:30px; opacity:0;
    pointer-events:none; transition:.25s; z-index:300; white-space:nowrap;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.empty{ text-align:center; color:#94a3b8; padding:25px 10px; font-size:13px; }

/* CALCULATOR CSS */
.calc-screen {
    background: #0f172a;
    color: #ffffff;
    text-align: right;
    padding: 16px 20px;
    border-radius: 16px;
    margin-bottom: 12px;
    word-break: break-all;
}

.calc-formula {
    font-size: 13px;
    color: #94a3b8;
    min-height: 18px;
}

.calc-value {
    font-size: 32px;
    font-weight: 800;
    margin-top: 4px;
}

.calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.calc-btn {
    height: 52px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    background: #f1f5f9;
    color: #0f172a;
}

.calc-btn:active {
    background: #e2e8f0;
    transform: scale(0.96);
}

.calc-btn.op { background: #e0f2fe; color: #0284c7; }
.calc-btn.action { background: #fef2f2; color: #dc2626; }
.calc-btn.equal { background: #2563eb; color: #ffffff; }

</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">MY LIFE <span>OS</span></div>
        <div class="subtitle">나만의 생활 관리 · 분석 플랫폼</div>
    </header>

    <div class="section-title">
        <span>📌 내 대시보드 (상단 공간)</span>
        <span style="font-size:11px; font-weight:normal; color:var(--sub);">아래 메뉴에서 끌어다 놓으세요</span>
    </div>

    <!-- UPPER DASHBOARD BOARD -->
    <div class="dash-board" id="dashBoard" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        <!-- JS로 동적 배치됨 -->
    </div>

    <div class="section-title">
        <span>빠른 메뉴</span>
        <span style="font-size:11px; font-weight:normal; color:var(--sub);">아이콘을 꾹 눌러 상단으로 드래그!</span>
    </div>

    <div class="menu" id="quickMenu">
        <!-- JS로 동적 배치됨 -->
    </div>

    <div class="section-title">오늘의 현황</div>

    <div class="card">
        <div class="stat-grid">
            <div class="stat"><div class="name">이번 달 청구 지출</div><div class="value" id="expenseTotal">0원</div></div>
            <div class="stat"><div class="name">완료한 할 일</div><div class="value" id="todoDone">0</div></div>
            <div class="stat"><div class="name">진행 목표</div><div class="value" id="goalProgress">0%</div></div>
            <div class="stat"><div class="name">메모</div><div class="value" id="memoCount">0</div></div>
        </div>
    </div>

    <div class="section-title">오늘의 할 일</div>
    <div class="card" id="todayTodo">
        <div class="empty">등록된 할 일이 없습니다.</div>
    </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom">
    <div class="bottom-inner">
        <button class="active" onclick="scrollTopPage()"><span>🏠</span><span>홈</span></button>
        <button onclick="openAI()"><span>🤖</span><span>AI</span></button>
        <button onclick="openModal('memo')"><span>📝</span><span>메모</span></button>
        <button onclick="openModal('settings')"><span>⚙️</span><span>설정</span></button>
    </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="handleModalBgClick(event)">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modalTitle">메뉴</h2>
            <button class="close" onclick="closeModal()">×</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   MY LIFE OS
   OFFLINE DATA ENGINE
========================================================= */

const DB_KEY = "MY_LIFE_OS_DATABASE_V1";

let db = loadDB();
let calcDisplay = "0";
let calcLastValue = 0;
let draggedCardId = null;

// 마스터 메뉴 정의 (운세 삭제)
const MENU_LIST = [
    { id: "ai", icon: "🤖", label: "AI 분석", action: openAI },
    { id: "expense", icon: "💰", label: "가계부", action: () => openModal('expense') },
    { id: "todo", icon: "✅", label: "할 일", action: () => openModal('todo') },
    { id: "schedule", icon: "📅", label: "일정", action: () => openModal('schedule') },
    { id: "goal", icon: "🎯", label: "목표", action: () => openModal('goal') },
    { id: "shopping", icon: "🛒", label: "장보기", action: () => openModal('shopping') },
    { id: "memo", icon: "📝", label: "메모", action: () => openModal('memo') },
    { id: "items", icon: "📦", label: "물건관리", action: () => openModal('items') },
    { id: "calculator", icon: "🧮", label: "계산기", action: () => openModal('calculator') }
];

function defaultDB(){
    return {
        placedCardIds: ["ai", "expense"],
        expenses:[], todos:[], schedules:[], goals:[], shopping:[], memos:[], items:[]
    };
}

function loadDB(){
    try{
        const data = localStorage.getItem(DB_KEY);
        if(data){
            const parsed = JSON.parse(data);
            if (!parsed.placedCardIds) {
                parsed.placedCardIds = ["ai", "expense"];
            }
            // 기존 데이터에 잔재하는 fortune ID 제거
            parsed.placedCardIds = parsed.placedCardIds.filter(id => id !== 'fortune');
            return { ...defaultDB(), ...parsed };
        }
    }catch(e){}
    return defaultDB();
}

function saveDB(){
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    updateDashboard();
}

/* =========================================================
   UTIL
========================================================= */

function money(n){ return Number(n || 0).toLocaleString("ko-KR") + "원"; }
function today(){ return new Date().toISOString().slice(0,10); }
function month(){ return today().slice(0,7); }
function esc(str){ return String(str ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'", "&#039;"); }
function toast(text){ const t=document.getElementById("toast"); t.textContent=text; t.classList.add("show"); setTimeout(()=>{ t.classList.remove("show"); },1800); }
function getTodayText() { const d = new Date(); const days = ["일","월","화","수","목","금","토"]; return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`; }

// 월별 지출 계산 (할부 포함)
function calculateMonthlyExpense(targetMonth) {
    const [tYear, tMonth] = targetMonth.split('-').map(Number);
    let total = 0;

    db.expenses.forEach(x => {
        if (!x.date) return;
        
        const payType = x.payType || "cash";
        const [eYear, eMonth] = x.date.slice(0, 7).split('-').map(Number);
        const monthDiff = (tYear - eYear) * 12 + (tMonth - eMonth);

        if (payType === "installment") {
            const months = Number(x.installMonths) || 1;
            if (monthDiff >= 0 && monthDiff < months) {
                total += Math.round(Number(x.amount) / months);
            }
        } else {
            if (monthDiff === 0) {
                total += Number(x.amount);
            }
        }
    });

    return total;
}

/* =========================================================
   DRAG AND DROP HANDLERS
========================================================= */

function handleDragStart(e, id) {
    draggedCardId = id;
    e.target.classList.add("dragging");
}

function handleDragEnd(e) {
    e.target.classList.remove("dragging");
}

function handleDragOver(e) {
    e.preventDefault();
    document.getElementById("dashBoard").classList.add("drag-over");
}

function handleDragLeave(e) {
    document.getElementById("dashBoard").classList.remove("drag-over");
}

function handleDrop(e) {
    e.preventDefault();
    document.getElementById("dashBoard").classList.remove("drag-over");

    if (!draggedCardId) return;

    if (!db.placedCardIds.includes(draggedCardId)) {
        db.placedCardIds.push(draggedCardId);
        saveDB();
        toast("상단 대시보드에 배치되었습니다");
    }

    draggedCardId = null;
}

function togglePlaceMenu(id, e) {
    if (e) e.stopPropagation();
    if (db.placedCardIds.includes(id)) {
        removeCard(id, e);
    } else {
        placeCard(id);
    }
}

function placeCard(id) {
    if (!db.placedCardIds.includes(id)) {
        db.placedCardIds.push(id);
        saveDB();
        toast("상단 대시보드에 배치되었습니다");
    }
}

function removeCard(id, e) {
    if (e) e.stopPropagation();
    db.placedCardIds = db.placedCardIds.filter(cId => cId !== id);
    saveDB();
    toast("대시보드에서 제거되었습니다");
}

/* =========================================================
   RENDER DASHBOARD & QUICK MENU
========================================================= */

function renderQuickMenu() {
    const menuEl = document.getElementById("quickMenu");
    menuEl.innerHTML = MENU_LIST.map(item => {
        const isPlaced = db.placedCardIds.includes(item.id);
        return `
            <div class="menu-item-btn ${isPlaced ? 'is-placed' : ''}" 
                 draggable="true" 
                 ondragstart="handleDragStart(event, '${item.id}')" 
                 ondragend="handleDragEnd(event)"
                 onclick="handleMenuClick('${item.id}')">
                
                ${isPlaced 
                    ? `<span class="menu-pin-badge">📌 배치됨</span>` 
                    : `<span class="menu-add-btn" onclick="togglePlaceMenu('${item.id}', event)">+</span>`}
                
                <div class="icon">${item.icon}</div>
                <div class="label">${item.label}</div>
            </div>
        `;
    }).join('');
}

function handleMenuClick(id) {
    const item = MENU_LIST.find(m => m.id === id);
    if (item && item.action) {
        item.action();
    }
}

function renderDashCards() {
    const board = document.getElementById("dashBoard");

    if (db.placedCardIds.length === 0) {
        board.innerHTML = `
            <div class="dash-board-empty">
                <b>상단 대시보드가 비어있습니다.</b><br>
                아래 [빠른 메뉴]의 아이콘을 끌어올리거나 <b>(+)</b> 버튼을 눌러 배치해보세요!
            </div>
        `;
        return;
    }

    board.innerHTML = db.placedCardIds.map(id => {
        if (id === 'ai') return renderAICard();
        if (id === 'expense') return renderExpenseCard();
        if (id === 'todo') return renderTodoCard();
        return renderGenericCard(id);
    }).join('');
}

/* CARD TEMPLATES */

function renderAICard() {
    const ai = AIAnalyze();
    return `

function openModal(type, prefillValue = null){
    const modal=document.getElementById("modal");
    const title=document.getElementById("modalTitle");
    const content=document.getElementById("modalContent");

    if(!modal.classList.contains("show")){ history.pushState({ modalOpen: true }, ""); }
    modal.classList.add("show");

    if(type==="expense"){ title.textContent="💰 가계부"; content.innerHTML=expenseHTML(prefillValue); }
    else if(type==="todo"){ title.textContent="✅ 할 일"; content.innerHTML=todoHTML(); }
    else if(type==="schedule"){ title.textContent="📅 일정"; content.innerHTML=scheduleHTML(); }
    else if(type==="goal"){ title.textContent="🎯 목표"; content.innerHTML=goalHTML(); }
    else if(type==="shopping"){ title.textContent="🛒 장보기"; content.innerHTML=shoppingHTML(); }
    else if(type==="memo"){ title.textContent="📝 메모"; content.innerHTML=memoHTML(); }
    else if(type==="items"){ title.textContent="📦 물건 관리"; content.innerHTML=itemHTML(); }
    else if(type==="calculator"){ title.textContent="🧮 계산기"; content.innerHTML=calculatorHTML(); }
    else if(type==="settings"){ title.textContent="⚙️ 설정 / 데이터"; content.innerHTML=settingsHTML(); }
}

function closeModal(fromPopstate = false){
    const modal = document.getElementById("modal");
    if(modal.classList.contains("show")){
        modal.classList.remove("show");
        if(!fromPopstate && history.state && history.state.modalOpen){ history.back(); }
    }
}

function handleModalBgClick(e){ if(e.target.id === "modal"){ closeModal(); } }
window.addEventListener("popstate", function(){ if(document.getElementById("modal").classList.contains("show")){ closeModal(true); } });

            <button class="calc-btn" onclick="pressCalc('6')">6</button>
            <button class="calc-btn op" onclick="pressCalc('-')">-</button>

            <button class="calc-btn" onclick="pressCalc('1')">1</button>
            <button class="calc-btn" onclick="pressCalc('2')">2</button>
            <button class="calc-btn" onclick="pressCalc('3')">3</button>
            <button class="calc-btn op" onclick="pressCalc('+')">+</button>

            <button class="calc-btn" onclick="pressCalc('0')">0</button>
            <button class="calc-btn" onclick="pressCalc('00')">00</button>
            <button class="calc-btn" onclick="pressCalc('.')">.</button>
            <button class="calc-btn equal" onclick="calculate()">=</button>
        </div>

        <button class="btn btn-green" style="margin-top:15px;" onclick="sendCalcToExpense()">
            💰 이 연산 결과를 가계부 금액으로 입력하기
        </button>
    `;
}

function pressCalc(val) {
    const displayEl = document.getElementById("calcDisplay");

    if (val === 'C') {
        calcDisplay = "0";
        calcLastValue = 0;
        document.getElementById("calcFormula").textContent = "";
    } else {
        const ops = ['+', '-', '*', '/', '.'];
        const lastChar = calcDisplay.slice(-1);

        if (ops.includes(val) && ops.includes(lastChar)) {
            calcDisplay = calcDisplay.slice(0, -1) + val;
        } else if (calcDisplay === "0" && !isNaN(val)) {
            calcDisplay = val;
        } else {
            calcDisplay += val;
        }
    }

    displayEl.textContent = calcDisplay;
}

function calculate() {
    const displayEl = document.getElementById("calcDisplay");
    const formulaEl = document.getElementById("calcFormula");

    try {
        formulaEl.textContent = calcDisplay + " =";
        const sanitizedFormula = calcDisplay.replace(/[^0-9+\-*/().]/g, '');
        const result = Function('"use strict"; return (' + sanitizedFormula + ')')();

        if (result === Infinity || isNaN(result)) {
            displayEl.textContent = "오류";
            calcDisplay = "0";
            calcLastValue = 0;
        } else {
            const roundedResult = Math.round(result * 100000000) / 100000000;
            displayEl.textContent = Number(roundedResult).toLocaleString("ko-KR");
            calcDisplay = String(roundedResult);
            calcLastValue = roundedResult;
        }
    } catch (e) {
        displayEl.textContent = "오류";
        calcDisplay = "0";
        calcLastValue = 0;
    }
}

function sendCalcToExpense(){
    calculate();

    if(calcLastValue <= 0) {
        toast("0원 이상의 금액만 전달 가능합니다.");
        return;
    }

    openModal("expense", calcLastValue);
    toast(`${money(calcLastValue)}가 가계부에 입력되었습니다.`);
}

/* =========================================================
   9. AI ENGINE & SCREEN
========================================================= */

function AIAnalyze(){
    const currentMonth=month();
    const total=calculateMonthlyExpense(currentMonth);
    const categories={};

    db.expenses.forEach(x=>{
        const payType = x.payType || "cash";
        const months = x.installMonths || 1;
        
        let effectiveAmount = 0;
        if (payType === "installment") {
            const [eYear, eMonth] = x.date.slice(0,7).split('-').map(Number);
            const [tYear, tMonth] = currentMonth.split('-').map(Number);
            const monthDiff = (tYear - eYear) * 12 + (tMonth - eMonth);
            if (monthDiff >= 0 && monthDiff < months) {
                effectiveAmount = Math.round(Number(x.amount) / months);
            }
        } else if (x.date.startsWith(currentMonth)) {
            effectiveAmount = Number(x.amount);
        }

        if (effectiveAmount > 0) {
            categories[x.category] = (categories[x.category] || 0) + effectiveAmount;
        }
    });

    const todos=db.todos;
    const todoTotal=todos.length;
    const todoDone=todos.filter(x=>x.done).length;
    const todoRate=todoTotal ? Math.round(todoDone/todoTotal*100) : 0;

    const goals=db.goals;
    const goalRate=goals.length ? Math.round(goals.reduce((s,x)=>s+Number(x.percent),0)/goals.length) : 0;

    let score=70;
    const findings=[];
    const advice=[];

    if(total===0){
        findings.push("아직 이번 달 소비 데이터가 충분하지 않습니다.");
    }else{
        const entries=Object.entries(categories).sort((a,b)=>b[1]-a[1]);
        const top=entries[0];

        if(top){
            const ratio=Math.round(top[1]/total*100);
            findings.push(`이번 달 청구 지출 중 가장 큰 항목은 <strong>${esc(top[0])}</strong>이며 전체의 ${ratio}%를 차지합니다.`);
            if(ratio>=40){
                score-=8;
                advice.push(`${top[0]} 지출 비중이 높습니다. 다음 달에는 해당 항목 예산을 조정해보세요.`);
            }else{ score+=3; }
        }

        if(total>=3000000){
            score-=10;
            advice.push("현재 월 예상 지출 규모가 큰 편입니다. 고정비와 변동비를 나누어 점검해 보세요.");
        }
    }

    if(todoTotal===0){
        findings.push("등록된 할 일이 없어 생활 실행률을 계산하기 어렵습니다.");
    }else{
        findings.push(`할 일 완료율은 <strong>${todoRate}%</strong>입니다.`);
        if(todoRate>=80){ score+=8; advice.push("할 일 관리가 매우 안정적입니다."); }
        else if(todoRate<50){ score-=8; advice.push("완료하지 못한 일이 많습니다. 중요 일부터 먼저 처리해보세요."); }
    }

    if(goals.length){
        findings.push(`현재 목표 평균 달성률은 <strong>${goalRate}%</strong>입니다.`);
        if(goalRate>=80){ score+=8; }
        else if(goalRate<40){ score-=7; advice.push("목표 달성률이 낮습니다. 더 작은 단계로 나누어 보세요."); }
    }

    if(db.memos.length>=5){ findings.push(`최근 ${db.memos.length}개의 메모가 저장되어 있습니다.`); }

    if(db.expenses.length===0 && todoTotal===0 && goals.length===0){
        score=50;
        advice.push("가계부, 할 일, 목표를 기록하시면 AI 분석 정확도가 높아집니다.");
    }

    score=Math.max(0,Math.min(100,Math.round(score)));
    let status = score>=85 ? "매우 좋음" : score>=70 ? "양호" : score>=55 ? "보통" : "관리 필요";

    return { score, status, total, todoRate, goalRate, findings, advice };
}

    openModal('ai');

    const title=document.getElementById("modalTitle");
    const content=document.getElementById("modalContent");

    title.textContent="🤖 AI 생활분석";
    content.innerHTML=`
        <div class="ai-box">
            <div class="ai-big-score">
                <div class="number">${result.score}</div>
                <div class="text">생활지수 · ${result.status}</div>
            </div>
        </div>

        <div class="stat-grid">
            <div class="stat"><div class="name">이번 달 예상 청구액</div><div class="value">${money(result.total)}</div></div>
            <div class="stat"><div class="name">할 일 완료율</div><div class="value">${result.todoRate}%</div></div>
            <div class="stat"><div class="name">목표 달성률</div><div class="value">${result.goalRate}%</div></div>
            <div class="stat"><div class="name">저장 데이터</div><div class="value">${db.expenses.length+db.todos.length+db.memos.length}</div></div>

        <div class="ai-box">
            ${result.findings.length ? result.findings.map(x=>`<div class="analysis-item">${x}</div>`).join("") : `<div class="empty">분석할 데이터가 없습니다.</div>`}
        </div>

        <div class="section-title" style="padding:0">💡 AI 생활 제안</div>
        <div class="ai-box">
            ${result.advice.length ? result.advice.map(x=>`<div class="analysis-item">💡 ${x}</div>`).join("") : `<div class="analysis-item">현재 생활 패턴이 매우 안정적입니다.</div>`}
        </div>

        <button class="btn btn-blue" onclick="openAI()">🔄 다시 분석</button>
    `;
}

/* =========================================================
   10. SETTINGS & BACKUP
========================================================= */

function settingsHTML(){
    return `
        <div class="ai-box">
            <strong>📱 MY LIFE OS 데이터</strong>
            <div class="list-sub" style="margin-top:8px">
                모든 데이터는 현재 휴대폰 브라우저의 LocalStorage에 저장됩니다.
            </div>
        </div>

        <button class="btn btn-blue" onclick="exportData()">📤 데이터 백업</button>
        <button class="btn btn-gray" onclick="document.getElementById('importFile').click()">📥 데이터 복원</button>
        <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn btn-red" onclick="resetData()">🗑 전체 데이터 삭제</button>
    `;
}

function exportData(){
    const blob=new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="MY_LIFE_OS_BACKUP_"+today()+".json";
    a.click();
    URL.revokeObjectURL(url);
    toast("백업 파일을 만들었습니다");
}

function importData(event){
    const file=event.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(){
        try{
            const data=JSON.parse(reader.result);
            db={ ...defaultDB(), ...data };
            saveDB();
            toast("데이터가 복원되었습니다");
            setTimeout(()=>{ openModal("settings"); },500);
        }catch(e){ alert("잘못된 백업 파일입니다."); }
    };
    reader.readAsText(file);
}

function resetData(){
    if(!confirm("모든 데이터가 삭제됩니다.\n정말 삭제할까요?"))return;
    db=defaultDB();
    saveDB();
    closeModal();
    toast("모든 데이터가 삭제되었습니다");
}

function updateDashboard(){
    const currentMonth=month();
    const total=calculateMonthlyExpense(currentMonth);

    document.getElementById("expenseTotal").textContent=money(total);
    document.getElementById("todoDone").textContent=db.todos.filter(x=>x.done).length;

    const goalRate=db.goals.length ? Math.round(db.goals.reduce((s,x)=>s+Number(x.percent),0)/db.goals.length) : 0;
    document.getElementById("goalProgress").textContent=goalRate+"%";
    document.getElementById("memoCount").textContent=db.memos.length;

    renderQuickMenu();
    renderDashCards();
    renderTodayTodo();
}

function renderTodayTodo(){
    const box=document.getElementById("todayTodo");
    const list=db.todos.filter(x=>x.date===today() && !x.done);

    if(!list.length){
        box.innerHTML=`<div class="empty">오늘 남은 할 일이 없습니다. 🎉</div>`;
        return;
    }

    box.innerHTML=list.map(x=>`
        <div class="list-item">
            <div class="list-main">
                <div class="list-title">${esc(x.text)}</div>
                <div class="list-sub">오늘의 할 일</div>
            </div>
        </div>
    `).join("");
}
